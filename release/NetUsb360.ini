; NetUsb360 settings. Put this file next to NetUsb360.xex, for example in
; Hdd:\Plugins\, and restart the console after changing it. Every line is
; optional: a setting that is missing, or a missing file, keeps the default of
; the XEX you loaded. 1 turns a setting on and 0 turns it off.

[NetUsb360]

; Show a message on screen once the adapter is connected, or after about 45
; seconds if it isn't (no adapter, unsupported adapter, or no cable).
Notify = 1

; Write NetUsb360-status.txt next to the plugin every five seconds: version,
; adapter, link speed, settings and the current transfer rate. Off by default
; because it writes to the hard drive while the console runs.
StatusFile = 0

; ACK batching, the experimental speed-up in NetUsb360-acksmall.xex. Acksmall
; sets the three settings below together. It is on by default only in the
; acksmall XEX. Experimental: if downloads from the Xbox freeze, set it to 0.
; Acksmall = 1

; The three parts of Acksmall, for testing. Ax88179TxAggregation without the
; other two froze the console in testing, so don't use it alone.
; Ax88179TxAggregation = 1
; CoalesceSmallFrames = 1
; AggregateSmallOnly = 1
